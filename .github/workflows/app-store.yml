name: App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      KEYCHAIN: ${{ runner.temp }}/app-store.keychain-db
          steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Import Apple Distribution and installer identities
        env:
          SIGNING_P12: ${{ secrets.APPLE_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then
            echo "APPLE_SIGNING_P12 is not configured" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" \
            -P "$SIGNING_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Write provisioning profile
        env:
          PROFILE: ${{ secrets.APP_STORE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "APP_STORE_PROVISIONING_PROFILE is not configured" >&2
            exit 1
          fi
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/Smack.provisionprofile"

      - name: Build sandboxed app
        env:
          SMACK_FLAVOR: app-store
          SMACK_SIGN_IDENTITY: ${{ secrets.SMACK_APP_STORE_IDENTITY }}
          SMACK_PROVISIONING_PROFILE: ${{ runner.temp }}/Smack.provisionprofile
        run: |
          if [ -z "$SMACK_SIGN_IDENTITY" ]; then
            echo "SMACK_APP_STORE_IDENTITY is not configured" >&2
            exit 1
          fi
          Scripts/build-app.sh release

      - name: Verify sandbox and absent helper
        run: |
          codesign -d --entitlements :- dist/Smack.app | grep com.apple.security.app-sandbox
          test ! -e dist/Smack.app/Contents/MacOS/SmackHelper
          test ! -e dist/Smack.app/Contents/Library/LaunchDaemons
          test ! -e dist/Smack.app/Contents/Resources/install-helper.sh
          test -e dist/Smack.app/Contents/embedded.provisionprofile

      - name: Build installer package
        env:
          SMACK_INSTALLER_IDENTITY: ${{ secrets.SMACK_INSTALLER_IDENTITY }}
        run: |
          test -n "$SMACK_INSTALLER_IDENTITY"
          productbuild --component dist/Smack.app /Applications \
            --sign "$SMACK_INSTALLER_IDENTITY" dist/Smack.pkg

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Smack-app-store
          path: dist/Smack.pkg
          retention-days: 30
