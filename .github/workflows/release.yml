name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: Scripts/build-app.sh release

      - name: Package release
        run: |
          ARCHIVE_NAME="Smack-${GITHUB_REF_NAME//\//-}-macOS-arm64"
          ditto -c -k --sequesterRsrc --keepParent dist/Smack.app "dist/${ARCHIVE_NAME}.zip"
          (cd dist && shasum -a 256 "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256")
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}.zip
            dist/${{ env.ARCHIVE_NAME }}.zip.sha256
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/${ARCHIVE_NAME}.zip" \
              "dist/${ARCHIVE_NAME}.zip.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/${ARCHIVE_NAME}.zip" \
              "dist/${ARCHIVE_NAME}.zip.sha256" \
              --generate-notes
          fi
